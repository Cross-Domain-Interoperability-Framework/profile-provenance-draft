# Publish the provenance activity vocabularies.
#
# Two sources, each the only file anyone edits for its vocabulary:
#   - vocabularies/CDIF_Activities.json: the CDIF provenance activity vocabulary,
#     https://w3id.org/cdif/concepts/provenance/activity/ (plus seven GSBPM 5.2 concepts,
#     https://w3id.org/cdif/concepts/GSBPM-5.2/activity/). Concept files go under
#     vocabularies/concepts/, mirroring the IRI path.
#   - vocabularies/activityTypes.jsonld: the DEPRECATED v0.1 activity types,
#     https://w3id.org/cdif/provenance/activityType/. Kept so its IRIs still resolve; each
#     concept points to its replacement. Concept files go under vocabularies/activityType/.
# For each:
#   - tools/buildVocabularyFiles.py writes the whole-scheme .ttl beside the source and one
#     .jsonld/.ttl per concept. Those are committed with the change, and the `check` job
#     fails a PR whose generated files are stale.
#   - the iSamples vocabulary tooling (isamplesorg/vocabularyTemplate, vocab2mdCacheV2.py)
#     writes Quarto markdown from the .ttl, including each term's owl:deprecated,
#     dcterms:isReplacedBy and skos:editorialNote, and Quarto renders it to HTML. The `render` job
#     commits that to vocabularies/docs/ on main, because GitHub Pages serves
#     main as it is; on a PR it only renders, and uploads the pages as an artifact.
# w3id.org/cdif/concepts/provenance/activity[/<concept>], cdif/concepts/GSBPM-5.2/activity/
# <concept> and cdif/provenance/activityType[/<concept>] redirect into these files by
# content negotiation (HTML, Turtle, JSON-LD).
#
# Why not the iSamples GitHub Action itself: at 43af182 its loader always purges the SQLite
# cache before creating it (navocab VocabularyStore(purge_existing=True) -> graph.destroy),
# which raises on a fresh cache, and the action then skips the vocabulary but exits 0. The
# markdown writer needs only an rdflib graph, so it is called on one directly and the cache
# is never involved.
name: Vocabulary pages

on:
  pull_request:
    paths:
      - 'vocabularies/**'
      - 'tools/buildVocabularyFiles.py'
      - '.github/workflows/vocabulary-pages.yml'
  push:
    branches: [main]
    paths:
      - 'vocabularies/activityTypes.jsonld'
      - 'vocabularies/CDIF_Activities.json'
      - 'tools/buildVocabularyFiles.py'
      - '.github/workflows/vocabulary-pages.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install rdflib
      - name: Generated vocabulary files are up to date
        run: |
          python tools/buildVocabularyFiles.py vocabularies/CDIF_Activities.json --check
          python tools/buildVocabularyFiles.py vocabularies/activityTypes.jsonld --check

  render:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check out the iSamples vocabulary tooling
        uses: actions/checkout@v4
        with:
          repository: isamplesorg/vocabularyTemplate
          # isamplesorg/vocabularyTemplate PR #4 (merged): the markdown writer reports deprecation,
          # replacements and editorial notes. Its requirements pin setuptools<81, which
          # rdflib-sqlalchemy (imported by vocab2mdCacheV2) needs on Python 3.12.
          ref: 411716c5367a71420b04c107427ae310c0e5a4ee
          path: .isamples
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r .isamples/tools/requirements.txt
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.6.43
      - name: Write Quarto markdown with the iSamples vocab2md writer
        run: |
          mkdir -p vocabularies/docs
          write_md() {  # <scheme .ttl> <scheme IRI> <output .md>
            python - "$1" "$2" > "$3" <<'EOF'
          import logging, sys, rdflib
          sys.path.insert(0, '.isamples/tools')
          import vocab2mdCacheV2 as v
          logging.disable(logging.CRITICAL)
          g = rdflib.Graph()
          g.parse(sys.argv[1], format='turtle')
          for line in v.describeVocabulary(g, rdflib.URIRef(sys.argv[2])):
              print(line)
          EOF
          }
          write_md vocabularies/CDIF_Activities.ttl https://w3id.org/cdif/concepts/provenance/activity/conceptScheme vocabularies/docs/CDIF_Activities.md
          write_md vocabularies/activityTypes.ttl https://w3id.org/cdif/provenance/activityType vocabularies/docs/activityTypes.md
          grep -q '^# \*\*Concept scheme:\*\* Concepts for CDIF Provenance Activities' vocabularies/docs/CDIF_Activities.md
          grep -q '^# \*\*Concept scheme:\*\* CDIF provenance activity types' vocabularies/docs/activityTypes.md
      - name: Render HTML
        run: |
          quarto render vocabularies/docs/CDIF_Activities.md -t html
          quarto render vocabularies/docs/activityTypes.md -t html
      - name: Add case-preserving concept anchors
        run: |
          python tools/buildVocabularyFiles.py vocabularies/CDIF_Activities.json --anchors vocabularies/docs/CDIF_Activities.html
          python tools/buildVocabularyFiles.py vocabularies/activityTypes.jsonld --anchors vocabularies/docs/activityTypes.html
      - name: Upload the rendered pages
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-pages
          path: vocabularies/docs
      - name: Commit the rendered pages
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898183+github-actions[bot]@users.noreply.github.com"
          git add vocabularies/docs
          if git diff --cached --quiet; then echo "rendered pages unchanged"; exit 0; fi
          git commit -m "Render provenance activity vocabulary pages"
          git push
